name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'type "deploy" to confirm production deployment'
        required: true
        default: ''

jobs:
  deploy-production:
    name: Deploy to Railway Production
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    if: github.event.inputs.confirm == 'deploy'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run type check
        run: pnpm run check

      - name: Build application
        run: pnpm run build

      - name: Run database migrations (production)
        # Applies any new Drizzle migrations from drizzle/*.sql against the
        # production DB before the new app build goes live. Idempotent — the
        # migration runner tracks which files have already been applied.
        # Skipped automatically if DATABASE_URL isn't configured for the env.
        run: |
          if [ -n "$DATABASE_URL" ]; then
            node dist/migrate.js
          else
            echo "DATABASE_URL not set for production environment, skipping migrations"
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway production
        run: |
          if [ -n "$RAILWAY_SERVICE_ID" ]; then
            railway up --service "$RAILWAY_SERVICE_ID"
          else
            railway up
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
