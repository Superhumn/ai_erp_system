name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'type "deploy" to confirm production deployment'
        required: true
        default: ''

# Same reasoning as deploy-staging.yml: Railway serves one container per
# service, so never let two production deploys overlap.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy to Railway Production
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    if: github.event.inputs.confirm == 'deploy'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Runs before the migration step. Two regimes:
      # - Staging tier not built (STAGING_SERVICE_ID repo variable unset):
      #   there is only one Railway service, so a "production" deploy is just
      #   a redeploy of that service — proceed with a notice (main dropped the
      #   old hard guard for exactly this reason).
      # - Staging tier built: production must be a distinct service; refuse a
      #   deploy whose id resolves to the staging one, while the production
      #   database is still untouched.
      - name: Verify Railway service routing
        env:
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          STAGING_SERVICE_ID: ${{ vars.STAGING_SERVICE_ID }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error title=Railway token missing::RAILWAY_TOKEN secret is not set for the 'production' environment. Add it in GitHub → Settings → Secrets and variables → Actions → Secrets (generate a project/service token in the Railway dashboard). Checked before migrations so a missing token can't leave the DB migrated with no matching release."
            exit 1
          fi
          if [ -z "$RAILWAY_SERVICE_ID" ]; then
            echo "::error title=Railway service id missing::RAILWAY_SERVICE_ID is not set. Add it as a variable (repository-level in the single-service setup, or environment-scoped on 'production' once the staging tier exists)."
            exit 1
          fi
          if [ -z "$STAGING_SERVICE_ID" ]; then
            echo "::notice title=Single-service setup::STAGING_SERVICE_ID is not set - no separate staging tier exists, so this deploys the one Railway service. See the 'Staging tier' section of DEPLOYMENT.md to add one."
          elif [ "$RAILWAY_SERVICE_ID" = "$STAGING_SERVICE_ID" ]; then
            echo "::error title=Production is pointing at the staging service::RAILWAY_SERVICE_ID resolved to ${RAILWAY_SERVICE_ID}, which is the staging service - a 'production' deploy would ship to staging and migrations would run against whichever DATABASE_URL the production environment holds. Set the 'production' environment's RAILWAY_SERVICE_ID to the production service id from the Railway dashboard."
            exit 1
          else
            echo "Production service: $RAILWAY_SERVICE_ID"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run type check
        run: pnpm run check

      - name: Build application
        run: pnpm run build

      - name: Run database migrations (production)
        # Applies any new Drizzle migrations from drizzle/*.sql against the
        # production DB before the new app build goes live. Idempotent — the
        # migration runner tracks which files have already been applied.
        # Skipped automatically if DATABASE_URL isn't configured for the env.
        run: |
          if [ -n "$DATABASE_URL" ]; then
            node dist/migrate.js
          else
            echo "DATABASE_URL not set for production environment, skipping migrations"
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy to Railway production
        # Preflight the Railway config before invoking the CLI so a
        # misconfiguration surfaces as a clear, actionable message instead of
        # the CLI's cryptic "error decoding response body / expected ident".
        # NB: DB migrations already ran in the step above, so a deploy that
        # fails here leaves the DB migrated but the app un-updated — fix the
        # config and re-run rather than rolling back migrations.
        run: |
          # Token and service id were preflighted in the routing guard above,
          # before migrations ran.
          # Constrain the CLI to the v4 major line so a v5 breaking release
          # can't change deploy behavior. 4.x minors still float — set an exact
          # version here if you need fully reproducible installs.
          npm install -g @railway/cli@^4 || {
            echo "::error title=Railway CLI install failed::Could not install @railway/cli."
            exit 1
          }
          railway up --service "$RAILWAY_SERVICE_ID"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
