name: Deploy to Staging

on:
  push:
    branches:
      - main

# Railway serves one container per service, so two `railway up` calls racing
# each other replace the container mid-healthcheck and the older run fails with
# "service unavailable". Queue deploys instead of running them in parallel;
# cancel-in-progress stays false so an in-flight deploy is never torn down
# halfway (migrations have already run by that point).
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy-staging:
    name: Deploy to Railway Staging
    needs: ci
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run type check
        run: pnpm run check

      - name: Build application
        run: pnpm run build

      # Runs before migrations so a misconfigured deploy is refused while the
      # staging DB is untouched. While STAGING_SERVICE_ID (repository
      # variable, set when the staging tier is created) is unset there is only
      # one Railway service and nothing to cross-check. Once it is set, this
      # attests that the staging workflow really deploys the staging service:
      # vars.RAILWAY_SERVICE_ID falls back to a repository-level value when
      # the 'staging' environment doesn't define one, and if that fallback
      # were the production id, staging deploys would silently ship to
      # production while the gated promotion's distinct-services check still
      # passed. The token is checked here too so a missing secret can't leave
      # the staging DB migrated with no matching release.
      - name: Verify staging deploys the staging service
        env:
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          STAGING_SERVICE_ID: ${{ vars.STAGING_SERVICE_ID }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error title=Railway token missing::RAILWAY_TOKEN secret is not set for the 'staging' environment. Add it in GitHub → Settings → Secrets and variables → Actions → Secrets (generate a project/service token in the Railway dashboard)."
            exit 1
          fi
          if [ -z "$RAILWAY_SERVICE_ID" ]; then
            echo "::error title=Railway service id missing::RAILWAY_SERVICE_ID variable is not set, so 'railway up' cannot target a service (bare 'railway up' has no linked project in CI and fails). Add it in GitHub → Settings → Secrets and variables → Actions → Variables (copy the service ID from the Railway dashboard)."
            exit 1
          fi
          if [ -n "$STAGING_SERVICE_ID" ] && [ "$RAILWAY_SERVICE_ID" != "$STAGING_SERVICE_ID" ]; then
            echo "::error title=Staging is not deploying the staging service::The staging tier exists (STAGING_SERVICE_ID is set) but this workflow's RAILWAY_SERVICE_ID resolved to ${RAILWAY_SERVICE_ID}, which is a different service — most likely a leftover repository-level RAILWAY_SERVICE_ID pointing at production. Set the 'staging' environment's RAILWAY_SERVICE_ID to ${STAGING_SERVICE_ID} (and delete the repository-level variable) so staging deploys never ship to production."
            exit 1
          fi
          echo "Staging service: $RAILWAY_SERVICE_ID"

      - name: Run database migrations (staging)
        # Applies any new Drizzle migrations from drizzle/*.sql against the
        # staging DB before the new app build goes live. Idempotent — the
        # migration runner tracks which files have already been applied.
        # Skipped automatically if DATABASE_URL isn't configured for the env.
        run: |
          if [ -n "$DATABASE_URL" ]; then
            node dist/migrate.js
          else
            echo "DATABASE_URL not set for staging environment, skipping migrations"
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy to Railway staging
        # Token and service id were preflighted in the guard step above,
        # before migrations, so a misconfiguration surfaces there as a clear,
        # actionable message instead of the CLI's cryptic "error decoding
        # response body / expected ident".
        run: |
          # Constrain the CLI to the v4 major line so a v5 breaking release
          # can't change deploy behavior. 4.x minors still float — set an exact
          # version here if you need fully reproducible installs.
          npm install -g @railway/cli@^4 || {
            echo "::error title=Railway CLI install failed::Could not install @railway/cli."
            exit 1
          }
          railway up --service "$RAILWAY_SERVICE_ID"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
