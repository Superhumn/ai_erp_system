name: Deploy

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy-staging:
    name: Deploy to Staging
    needs: ci
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build application
        run: pnpm run build

      - name: Run database migrations (staging)
        # Applies any new Drizzle migrations from drizzle/*.sql against the
        # staging DB before the new build goes live. Idempotent — the migration
        # runner tracks which files have already been applied. Skipped if
        # DATABASE_URL isn't configured for the environment. Disk-full errors are
        # treated as non-blocking in staging.
        run: |
          if [ -n "$DATABASE_URL" ]; then
            node dist/migrate.js
          else
            echo "DATABASE_URL not set for staging environment, skipping migrations"
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATION_ALLOW_DISK_FULL_FAILURE: "true"

      - name: Deploy to Staging (Railway CLI, optional)
        # App deploys are handled by Railway's native GitHub integration.
        # This CLI step is a best-effort fallback: it runs only if a token is
        # present, and never fails the run (a bad/absent token just logs a
        # warning and defers to the GitHub integration). Migrations above are
        # strict and still gate the deploy.
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "No RAILWAY_TOKEN set — skipping CLI deploy; Railway's GitHub integration handles deploys."
            exit 0
          fi
          npm install -g @railway/cli || {
            echo "::warning::Railway CLI install failed. Deferring to Railway's GitHub integration."
            exit 0
          }
          rc=0
          if [ -n "$RAILWAY_SERVICE_ID" ]; then
            railway up --service "$RAILWAY_SERVICE_ID" || rc=$?
          else
            railway up || rc=$?
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::warning::railway up failed (exit $rc; token invalid or lacks access). Deferring to Railway's GitHub integration."
          fi
          exit 0
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build application
        run: pnpm run build

      - name: Run database migrations (production)
        # Applies any new Drizzle migrations from drizzle/*.sql against the
        # production DB before the new build goes live. Idempotent — the
        # migration runner tracks which files have already been applied. Skipped
        # if DATABASE_URL isn't configured for the environment.
        run: |
          if [ -n "$DATABASE_URL" ]; then
            node dist/migrate.js
          else
            echo "DATABASE_URL not set for production environment, skipping migrations"
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy to Production (Railway CLI)
        # This is the real production deploy: every push to main that passes
        # CI + staging ships here automatically. It was previously a
        # best-effort no-op that deferred to Railway's GitHub integration
        # (which isn't connected), so production silently never updated.
        # Preflight the Railway config so a misconfiguration surfaces as a
        # clear, actionable message instead of the CLI's cryptic
        # "error decoding response body / expected ident".
        # NB: DB migrations already ran in the step above, so a deploy that
        # fails here leaves the DB migrated but the app un-updated — fix the
        # config and re-run rather than rolling back migrations.
        # To gate this behind a one-click approval, add Required reviewers to
        # the 'production' environment in GitHub Settings → Environments.
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error title=Railway token missing::RAILWAY_TOKEN secret is not set for the 'production' environment. Add it in GitHub → Settings → Secrets and variables → Actions → Secrets (generate a project/service token in the Railway dashboard)."
            exit 1
          fi
          if [ -z "$RAILWAY_SERVICE_ID" ]; then
            echo "::error title=Railway service id missing::RAILWAY_SERVICE_ID variable is not set, so 'railway up' cannot target a service. Add it in GitHub → Settings → Secrets and variables → Actions → Variables (copy the service ID from the Railway dashboard)."
            exit 1
          fi
          # Constrain the CLI to the v4 major line so a v5 breaking release
          # can't change deploy behavior.
          npm install -g @railway/cli@^4 || {
            echo "::error title=Railway CLI install failed::Could not install @railway/cli."
            exit 1
          }
          railway up --service "$RAILWAY_SERVICE_ID"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
